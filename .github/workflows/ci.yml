name: Python CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'dummy-secret-key-for-ci-12345' }}
      DEBUG: False
      DATABASE_URL: sqlite:///db.sqlite3
      USE_SQLITE: True

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # Явно указываем версию вместо чтения из pyproject.toml
          cache: 'uv'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv
          source .venv/bin/activate
          uv pip install -e .[dev]

      - name: Run Django migrations
        run: |
          source .venv/bin/activate
          python manage.py makemigrations
          python manage.py migrate

      - name: Run tests
        run: |
          source .venv/bin/activate
          python manage.py test

      - name: Run linter
        run: |
          source .venv/bin/activate
          ruff check task_manager

      - name: Generate coverage
        run: |
          source .venv/bin/activate
          pip install coverage
          coverage run --source='.' manage.py test
          coverage xml

      - name: SonarQube Scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=darthlivesey_python-project-52
            -Dsonar.organization=darthlivesey
            -Dsonar.python.coverage.reportPaths=coverage.xml